[workspace]
resolver = "2"
members = ["crates/fabric-data", "crates/fabric-viewer"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/personne-admin/fabric-stretch"
keywords = ["fabric", "textile", "photometric-stereo", "material-capture", "egui"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
