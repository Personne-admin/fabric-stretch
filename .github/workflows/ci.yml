name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Tests
        run: python -m pytest -q

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libgl1-mesa-dev libvulkan-dev libgtk-3-dev mesa-vulkan-drivers
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy (demo feature)
        run: cargo clippy --workspace --all-targets --features fabric-viewer/demo -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Headless snapshot smoke test
        run: |
          cargo run --release -p fabric-viewer --example press_snapshot -- examples/demo \
            --indentation 12 --relight --size 400x240 --out "$RUNNER_TEMP/press.png"
          test -s "$RUNNER_TEMP/press.png"

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck -x server/bootstrap.sh server/fabsim-track server/lib/*.sh server/tests/*.sh \
            server/tests/fakebin/* scripts/*.sh

  binaries:
    needs: [python, rust, shellcheck]
    uses: ./.github/workflows/build.yml
    with:
      release_tag: ${{ inputs.release_tag || '' }}
