name: Binaries

on:
  workflow_call:
    inputs:
      release_tag:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x86_64
            rust_target: x86_64-unknown-linux-gnu
          - os: windows-2022
            target: windows-x86_64
            rust_target: x86_64-pc-windows-msvc
    defaults:
      run:
        shell: bash
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_RELEASE_STRIP: symbols
      PYTHONUTF8: 1
      DOTNET_ROLL_FORWARD: Major
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            scripts/release-requirements.txt
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: binaries-${{ matrix.target }}
      - if: runner.os == 'Linux'
        name: Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libgl1-mesa-dev libvulkan-dev libgtk-3-dev mesa-vulkan-drivers xvfb xauth python3-tk
      - name: Python build tools
        run: python -m pip install -e '.[rig]' -r scripts/release-requirements.txt
      - name: Version
        id: version
        run: |
          version=$(python scripts/release.py version --tag "$RELEASE_TAG")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build binaries
        run: |
          python scripts/release.py build \
            --stage "build/stage/fabric-stretch-${{ steps.version.outputs.version }}" \
            --target '${{ matrix.rust_target }}'
      - name: Smoke test binaries
        run: |
          stage="build/stage/fabric-stretch-${{ steps.version.outputs.version }}"
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a python scripts/release.py smoke --stage "$stage" --gui
          else
            python scripts/release.py smoke --stage "$stage" --gui
          fi
      - if: runner.os == 'Windows'
        name: WiX
        run: dotnet tool install --global wix --version 5.0.2
      - name: Package
        run: |
          python scripts/release.py pack \
            --stage "build/stage/fabric-stretch-${{ steps.version.outputs.version }}" \
            --out dist/release --target '${{ matrix.target }}'
      - if: runner.os == 'Linux'
        name: Smoke test Debian installation
        run: |
          sudo apt-get install -y ./dist/release/*.deb
          fabric-viewer --version
          xvfb-run -a python scripts/release.py smoke --stage /opt/fabric-stretch --gui
          sudo apt-get remove -y fabric-stretch
      - if: runner.os == 'Windows'
        name: Smoke test MSI installation
        shell: pwsh
        run: |
          $msi = (Get-ChildItem dist/release/*.msi).FullName
          $install = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /norestart /l*v `"$env:RUNNER_TEMP\install.log`"" -Wait -PassThru
          if ($install.ExitCode -notin @(0, 3010)) {
            Get-Content "$env:RUNNER_TEMP\install.log" -Tail 100
            throw "MSI install failed: $($install.ExitCode)"
          }
          try {
            python scripts/release.py smoke --stage "$env:ProgramFiles\Fabric Stretch" --gui
            if ($LASTEXITCODE -ne 0) { throw 'Installed binaries failed smoke tests' }
          } finally {
            $remove = Start-Process msiexec.exe -ArgumentList "/x `"$msi`" /qn /norestart" -Wait -PassThru
            if ($remove.ExitCode -notin @(0, 3010)) { throw "MSI uninstall failed: $($remove.ExitCode)" }
          }
      - if: runner.os == 'Linux'
        name: Python distributions
        run: python -m build --outdir dist/release
      - name: Checksums
        run: python scripts/release.py checksums --out dist/release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.target }}
          path: dist/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-logs-${{ matrix.target }}
          path: |
            build/frozen/**/warn-*.txt
            ${{ runner.temp }}/install.log
