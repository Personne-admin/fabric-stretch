name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 scripts/release.py version --tag "$GITHUB_REF_NAME"

  test-and-build:
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      release_tag: ${{ github.ref_name }}

  publish:
    needs: test-and-build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist/release
      - name: Prepare release
        run: |
          python scripts/release.py version --tag "$GITHUB_REF_NAME"
          python scripts/release.py verify-assets --out dist/release
          python scripts/release.py checksums --out dist/release
          python scripts/release.py notes --out dist/RELEASE_NOTES.md
          cd dist/release
          sha256sum -c SHA256SUMS
      - name: Publish
        run: |
          if gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft > "$RUNNER_TEMP/release-state" 2>/dev/null; then
            test "$(cat "$RUNNER_TEMP/release-state")" = true
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft \
              --title "Fabric Stretch ${GITHUB_REF_NAME#v}" --notes-file dist/RELEASE_NOTES.md
          fi
          gh release upload "$GITHUB_REF_NAME" dist/release/* --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
