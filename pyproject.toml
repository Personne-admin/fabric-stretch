[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fabsim"
dynamic = ["version"]
description = "Measurement pipeline for stretched-fabric appearance"
readme = "README.md"
license = { text = "Apache-2.0" }
keywords = ["photometric stereo", "textile", "material capture", "stretch test"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Processing",
]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "opencv-python-headless>=4.4",  # cv2.SIFT_create
    "pillow",
]

[project.optional-dependencies]
rig = ["pyserial"]
dev = ["pytest", "ruff"]

[project.urls]
Repository = "https://github.com/personne-admin/fabric-stretch"

[project.scripts]
fabsim = "fabsim.cli:main"

[tool.setuptools.dynamic]
version = { attr = "fabsim.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"fabsim.rig" = ["defaults/*.json"]

[tool.ruff]
target-version = "py310"
line-length = 110
src = ["src", "tests/python"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E741"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
markers = [
    "realdata: needs the measurement data (FABSIM_DATA_DIR) set",
]
